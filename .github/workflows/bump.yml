name: Update formula

on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the formula at the latest release
        id: bump
        run: echo "version=$(.github/scripts/bump.sh)" >> "$GITHUB_OUTPUT"
      - name: Commit and push
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "terminal-tooling ${{ steps.bump.outputs.version }}"
          git push
